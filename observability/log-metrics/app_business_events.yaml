description: "Contagem de eventos de negocio do Todo List (criacao, conclusao, reabertura, exclusao de tarefas)."
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="backend"
  jsonPayload.event="business_event"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: event_name
      valueType: STRING
      description: "todo_created, todo_completed, todo_reopened ou todo_deleted"
labelExtractors:
  event_name: EXTRACT(jsonPayload.event_name)
