description: "Distribuicao da duracao (ms) das operacoes do backend contra o MongoDB Atlas, por tipo de operacao."
filter: |-
  resource.type="cloud_run_revision"
  resource.labels.service_name="backend"
  jsonPayload.event="db_operation"
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
  labels:
    - key: operation
      valueType: STRING
      description: "Operacao (list, create, update, delete)"
valueExtractor: EXTRACT(jsonPayload.duration_ms)
labelExtractors:
  operation: EXTRACT(jsonPayload.operation)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 32
    growthFactor: 2
    scale: 1
